version: 0.2

phases:
  install:
    commands:
      - echo "Install phase: nothing to install"
  pre_build:
    commands:
      - echo "Pre-build phase: checking files"
      - ls -la
      - pwd
  build:
    commands:
      - echo "Build phase"
      - ls -la
      - echo "Listing all files recursively:"
      - find .

artifacts:
  files:
    - '**/*'
  discard-paths: yes
